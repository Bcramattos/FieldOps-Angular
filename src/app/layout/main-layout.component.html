<input
  type="checkbox"
  id="sidebarToggle"
  class="sidebar-toggle"
  [checked]="menuOpen"
  (change)="menuOpen = !menuOpen"
/>
<label for="sidebarToggle" class="sidebar-overlay" (click)="closeMenu()"></label>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="brand-icon"><i class="bi bi-boxes"></i></div>
    <div class="brand-text">
      <h5>FieldOps</h5>
      <span>Enterprise System</span>
    </div>
    <label for="sidebarToggle" class="btn-close-sidebar" (click)="closeMenu()">
      <i class="bi bi-x-lg"></i>
    </label>
  </div>

  <div class="sidebar-section-title">MÓDULOS PRINCIPAIS</div>
  <nav class="sidebar-nav" aria-label="Módulos principais">
    <a
      *ngFor="let item of visibleNavigation"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
      (click)="closeMenu()"
    >
      <i [class]="item.icon" aria-hidden="true"></i>
      <span>{{ item.label }}</span>
      <span *ngIf="badgeCount(item.badge) as count" class="nav-badge" [class.danger]="item.badge === 'nonconformities'">{{ count }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="system-status">
      <span class="status-dot"></span>
      <span>v4.8.2-PROD</span>
    </div>
    <span class="security-status">SEC-OK</span>
  </div>
</aside>

<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <label for="sidebarToggle" class="mobile-menu" aria-label="Abrir menu">
        <i class="bi bi-list"></i>
      </label>
      <div class="sync-status">
        <span class="status-dot"></span>
        Sincronização
        <strong>Ativa</strong>
      </div>
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input
          type="search"
          name="globalSearch"
          [(ngModel)]="searchQuery"
          (keyup.enter)="runSearch()"
          placeholder="Buscar código, ativo, local..."
          aria-label="Buscar no FieldOps"
        />
        <kbd>CTRL K</kbd>
      </div>
    </div>

    <div class="topbar-right">
      <div class="unit-selector">
        <i class="bi bi-building"></i>
        <div><small>Unidade</small><strong>Complexo Industrial Sul</strong></div>
        <i class="bi bi-chevron-down"></i>
      </div>
      <a class="notification-button icon-button" routerLink="/nonconformities" aria-label="Ver não conformidades">
        <i class="bi bi-bell"></i><span></span>
      </a>
      <div class="dropdown profile">
        <button class="profile-trigger" type="button" (click)="profileOpen = !profileOpen" [attr.aria-expanded]="profileOpen">
          <span class="profile-info"><strong>{{ userName }}</strong><small>{{ roleLabel }}</small></span>
          <span class="profile-avatar">{{ userInitials }}</span>
          <i class="bi bi-chevron-down profile-arrow"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" [class.show]="profileOpen">
          <li><a class="dropdown-item" [routerLink]="canManageUsers ? '/users' : '/dashboard'" (click)="profileOpen = false"><i class="bi bi-person"></i> Meu perfil</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button class="dropdown-item text-danger" type="button" (click)="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button></li>
        </ul>
      </div>
    </div>
  </header>

  <router-outlet />
</div>
